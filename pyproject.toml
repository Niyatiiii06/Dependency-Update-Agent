[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dependency-update-agent"
version = "0.1.0"
description = "AI-powered dependency impact analysis agent"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = [
    "agents*",
    "analysis*",
    "config*",
    "dependency*",
    "ingestion*",
    "judgment*",
    "search*",
    "storage*",
    "tools*",
    "ui*"
]